# 复制为 config.toml 后生效；所有阈值可配，不写死代码。
# 命令行 --db 参数优先级最高。

[knowbot]
# 数据库路径（建议在仓库根目录运行 daemon，保持相对路径稳定）
db_path = "./data/knowbot.db"

# 心跳周期（秒）：存活证明 + 事件缺口探测
heartbeat_period = 60.0

# 事件总线容量：满即丢弃并计数，绝不反压（阻塞 COM 回调会拖死系统音频通知）
queue_size = 10000

# 落库批量：条数阈值或时间阈值先到先触发
batch_size = 200
flush_interval = 0.5

# 传感器开关（缺依赖/失败时自动降级为 unavailable 事件，不拖垮 daemon）
enable_audio = true
enable_winmsg = true

# 空闲传感器（trickle 第一件）：只有"多久没碰键鼠"一个数字，永不接触内容
enable_idle = true
idle_threshold_s = 300.0   # 空闲越过阈值 → idle_begin（默认 5 分钟）
idle_poll_s = 10.0         # 轮询周期（单次轻量 API 调用）

# 聚合层（A3）：把传感器爆发折叠成语义事件（audio.flow 命名空间）
# churn_flips/co_devices 双阈值：单设备翻转多，或多端点协同翻转，都判不稳定
enable_aggregation = true
agg_settle_s = 1.0
agg_churn_flips = 3
agg_co_window_s = 3.0
agg_co_devices = 2
agg_max_span_s = 60.0
agg_tick_interval = 0.5

# Phase 1 ①：音量观察（IAudioEndpointVolumeCallback，含 actor=user/agent 区分）
enable_volume_watch = true
vol_settle_s = 1.5

# pre-arm：默认输出切走时，趁休眠端点把音量预埋到安全值（只降不升）。
# 默认关——真机插拔验证后再开。
enable_prearm = false
prearm_safe_scalar = 0.2
prearm_only_lower = true
prearm_cooldown_s = 300.0   # 同设备布防冷却（see-saw 防护，秒）

# Phase 1 ②：音量技能（首个 Skill，影子模式起步）
enable_volume_skill = true
volume_skill_dry_run = true

# 计算礼貌（哲学 9）：影子决策 toast 节流——决策照常落台账，只压制通知
shadow_toast_cooldown_s = 600.0   # 同设备冷却（秒）
shadow_toast_daily = 30           # 全局日预算（条）

# Phase 3：启动技能（解锁后开工组合，docs/phase3-startup-skill.md）
# 爬升：观察层永远在跑 → 组合草稿(面板确认) → 建议档 → 自动拉起(explicit+missed≥3)
enable_startup = true
startup_window_s = 900.0        # 节律观察窗（解锁后 N 秒内的启动集合）
startup_min_samples = 5         # 最少解锁样本才生成组合草稿（宁可不学不可学错）
startup_member_rate_floor = 0.4 # 成员出现率淘汰线（衰减淘汰）
startup_suggest_delay_s = 90.0  # 解锁后等 N 秒再开口（等你开首波程序）
startup_silence_ratio = 0.6     # 手动开 ≥ 此比例 → 沉默记 missed_need（不弹）

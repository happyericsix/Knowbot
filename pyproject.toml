[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "knowbot"
version = "0.1.0"
description = "个人驻留事件 Agent —— Phase 0 事件记录仪"
requires-python = ">=3.10"
dependencies = [
    "comtypes>=1.4",
    "pycaw>=20230407",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
knowbot = "knowbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

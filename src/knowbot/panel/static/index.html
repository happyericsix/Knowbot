<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>knowbot 记忆面板</title>
<style>
  :root { --bg:#101418; --card:#1a2129; --line:#2a333e; --fg:#d8dee6; --dim:#8a95a3;
          --ok:#5fb87a; --warn:#d9a35f; --bad:#d97a7a; --accent:#6aa5d9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding:20px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  nav { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  nav button { background:var(--card); border:1px solid var(--line); color:var(--fg);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  nav button.active { border-color:var(--accent); color:var(--accent); }
  #pause { margin-left:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card h3 { font-size:13px; color:var(--dim); font-weight:normal; margin-bottom:6px; }
  .big { font-size:26px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:normal; white-space:nowrap; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; border:1px solid var(--line); }
  .tag.draft, .tag.pending { color:var(--warn); border-color:var(--warn); }
  .tag.active { color:var(--ok); border-color:var(--ok); }
  .tag.archived, .tag.stale { color:var(--dim); }
  .tag.dry_run { color:var(--accent); }
  .tag.none { color:var(--dim); }
  .tag.silent, .tag.notify { color:var(--ok); }
  .bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  button.op { background:none; border:1px solid var(--line); color:var(--fg); border-radius:5px;
    padding:2px 10px; cursor:pointer; font-size:12px; margin-right:4px; }
  button.op:hover { border-color:var(--accent); color:var(--accent); }
  .mono { font-family:Consolas, monospace; font-size:12px; }
  .dim { color:var(--dim); }
  #view { max-width:1100px; }
</style>
</head>
<body>
<h1>knowbot · 记忆面板</h1>
<div class="sub" id="subtitle">加载中…</div>
<nav>
  <button data-tab="overview" class="active">概览</button>
  <button data-tab="prefs">偏好库 / 待确认</button>
  <button data-tab="actions">动作台账</button>
  <button data-tab="events">事件流</button>
  <button data-tab="settings">设置</button>
  <button id="pause">⏸ 暂停</button>
</nav>
<div id="view"></div>

<script>
let tab = 'overview', paused = false, timer = null;

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fmt = v => v == null ? '—' : (typeof v === 'number' ? v.toLocaleString() : v);

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function refresh() {
  try {
    if (tab === 'overview') await renderOverview();
    else if (tab === 'prefs') await renderPrefs();
    else if (tab === 'actions') await renderActions();
    else if (tab === 'settings') await renderSettings();
    else await renderEvents();
  } catch (e) { $('#subtitle').textContent = '刷新失败: ' + e.message; }
}

async function renderSettings() {
  const d = await api('/api/auth');
  $('#subtitle').textContent = '中间地带传感器授权（未授权 = 不采集；撤销即焚：停采并删除其全部历史）';
  const v = $('#view'); v.innerHTML = '';
  for (const s of d.items) {
    const card = el('div','card'); card.style.marginBottom = '10px';
    const head = el('div');
    const dot = el('span', 'tag ' + (s.granted ? 'active' : 'draft'),
                   s.granted ? '已授权' : '未授权');
    head.append(el('b', null, s.name), dot);
    if (s.granted_at) head.append(el('span','dim',' ' + s.granted_at.slice(0,16)));
    card.append(head, el('div','dim', s.desc));
    const ops = el('div'); ops.style.marginTop = '8px';
    if (!s.granted) {
      const g = el('button','op','授权采集');
      g.onclick = async () => { try { await api(`/api/auth/${s.sensor}/grant`, {method:'POST'}); } catch(e){ alert(e.message); } refresh(); };
      ops.append(g);
    } else {
      const r = el('button','op','撤销并焚毁历史');
      r.onclick = async () => {
        if (!confirm(`确定撤销「${s.name}」？将停止采集并删除其全部历史事件，不可恢复。`)) return;
        try { const res = await api(`/api/auth/${s.sensor}/revoke`, {method:'POST'}); alert(`已焚毁 ${res.purged_events} 条历史事件`); } catch(e){ alert(e.message); }
        refresh();
      };
      ops.append(r);
    }
    card.append(ops); v.append(card);
  }
}

async function renderOverview() {
  const d = await api('/api/overview');
  paused = d.paused;
  updatePauseBtn();
  $('#subtitle').textContent = `最近事件 ${d.last_event || '—'} · 影子模式: ${d.flags.dry_run ? '开' : '关'}`;
  const v = $('#view'); v.innerHTML = '';
  const grid = el('div', 'grid');
  const card = (t, val, extra) => { const c = el('div','card'); c.append(el('h3',null,t), el('div','big',val)); if (extra) c.append(extra); return c; };
  grid.append(
    card('事件总数', fmt(d.events_total)),
    card('偏好（生效/待确认）', `${d.preferences.active||0} / ${d.preferences.draft||0}`),
    card('台账动作', fmt(d.actions_total)),
    card('全局暂停', d.paused ? '已暂停' : '运行中'));
  const qw = d.quadrant_week || {};
  const faCard = el('div','card');
  const faPct = qw.fa_rate == null ? '—' : (qw.fa_rate*100).toFixed(0) + '%';
  const faBig = el('div','big', faPct);
  if (qw.fa_rate != null) faBig.style.color = qw.fa_rate >= qw.health_line ? 'var(--bad)' : 'var(--ok)';
  faCard.append(el('h3',null,'本周误报率（健康线<' + Math.round(qw.health_line*100) + '%）'), faBig,
    el('div','dim', `出手${(qw.counts?.correct_detection||0)+(qw.counts?.false_alarm||0)} · 纠错${qw.counts?.correct_detection||0}`),
    el('div','dim', `错过需求${qw.counts?.missed_need||0} · 待裁决${qw.unresolved||0}`));
  grid.append(faCard);
  const react = el('div','card');
  react.append(el('h3',null,'用户反应（四象限积累）'));
  for (const [k, label] of [['accept','接受'],['correct','纠正'],['missed_need','错过的需求'],['reject','撤销/拒绝']]) {
    const n = d.reactions[k] || 0;
    const row = el('div'); row.append(Object.assign(el('span','dim',label+' '), {style:'flex:1'}), el('span','num',String(n)));
    react.append(row);
  }
  grid.append(react);
  v.append(grid);
  const tbl = el('table'); tbl.innerHTML = '<tr><th>传感器</th><th>事件数</th></tr>';
  for (const [s, n] of Object.entries(d.sensors).sort((a,b)=>b[1]-a[1]))
    tbl.append(Object.assign(el('tr'), {innerHTML:`<td class="mono">${s}</td><td class="num">${n}</td>`}));
  const wrap = el('div','card'); wrap.style.marginTop='12px';
  wrap.append(el('h3',null,'传感器分布'), tbl); v.append(wrap);
}

function calibrateButtons(body) {
  const span = el('span');
  for (const [v, label] of [['soft','太轻'],['ok','刚好'],['loud','太吵']]) {
    const b = el('button','op',label);
    b.onclick = async () => {
      try { await api('/api/calibrate', {method:'POST',
        body: JSON.stringify({...body, value:v}),
        headers:{'Content-Type':'application/json'}}); }
      catch(e){ alert(e.message); }
      refresh();
    };
    span.append(b);
  }
  return span;
}

async function renderPrefs() {
  const d = await api('/api/preferences');
  const pr = await api('/api/proposals');
  const pending = (pr.items || []).filter(p => p.status === 'pending');
  $('#subtitle').textContent = `共 ${d.items.length} 条 · 待确认（草稿）排前面`
    + (pending.length ? ` · 泛化提案 ${pending.length} 条待裁决` : '');
  const v = $('#view'); v.innerHTML = '';

  if (pending.length) {
    const wrap = el('div','card'); wrap.style.marginBottom = '12px';
    wrap.append(el('h3', null, '泛化提案（推断待确认——explicit 压过一切推断）'));
    for (const p of pending) {
      const c = JSON.parse(p.content);
      const row = el('div');
      const desc = el('span', null,
        `${c.scope_key} ← ${JSON.stringify(c.value)}（置信 ${p.confidence?.toFixed?.(2) ?? p.confidence}，` +
        `${c.instances} 台实例一致）`);
      desc.style.marginRight = '12px';
      const ok = el('button','op','✓ 接受并升格');
      ok.onclick = async () => { try { await api(`/api/proposal/${p.id}/accept`, {method:'POST'}); } catch(e){ alert(e.message); } refresh(); };
      const no = el('button','op','✗ 拒绝并静默');
      no.onclick = async () => { try { await api(`/api/proposal/${p.id}/reject`, {method:'POST'}); } catch(e){ alert(e.message); } refresh(); };
      row.append(desc, ok, no); wrap.append(row);
    }
    v.append(wrap);
  }

  const t = el('table');
  t.innerHTML = `<tr><th>状态</th><th>旋钮</th><th>作用域</th><th>值</th><th>置信</th><th>来源</th><th>证据</th><th>操作</th></tr>`;
  for (const p of d.items) {
    const tr = el('tr');
    const conf = el('td'); conf.append(el('div','num',p.confidence.toFixed(2)),
      el('div','bar', '')); conf.querySelector('.bar').append(Object.assign(el('i'), {style:`width:${p.confidence*100}%`}));
    const scope = p.scope === 'global' ? '全局' : (p.scope === 'class' ? '类 ' + p.scope_key.split(':').pop() : p.scope_key.slice(-18));
    tr.innerHTML = `<td><span class="tag ${p.state}">${p.state}</span></td>
      <td class="mono">${p.pref_key}</td><td class="dim mono">${scope}</td>
      <td class="mono">${p.value}</td>`;
    tr.append(conf, el('td','dim',p.source), el('td','num',String(p.evidence_count)));
    const ops = el('td');
    if (p.state === 'draft' || p.state === 'pending') {
      ops.append(calibrateButtons({pref_id: p.id}));
      const ok = el('button','op','✓ 确认生效');
      ok.onclick = async () => { await api(`/api/preference/${p.id}/confirm`, {method:'POST'}); refresh(); };
      const no = el('button','op','✗ 拒绝并静默');
      no.onclick = async () => { await api(`/api/preference/${p.id}/reject`, {method:'POST'}); refresh(); };
      ops.append(ok, no);
    } else ops.append(el('span','dim','—'));
    tr.append(ops); t.append(tr);
  }
  v.append(t);
}

async function renderActions() {
  const d = await api('/api/actions?limit=100');
  $('#subtitle').textContent = `最近 ${d.items.length} 条（含影子动作）`;
  const v = $('#view'); v.innerHTML = '';
  const t = el('table');
  t.innerHTML = `<tr><th>时间</th><th>技能</th><th>模式</th><th>动作</th><th>反应</th><th>象限</th><th>操作</th></tr>`;
  for (const a of d.items) {
    const tr = el('tr');
    tr.innerHTML = `<td class="mono dim">${(a.ts_wall||'').slice(5,19)}</td>
      <td>${a.skill}</td><td><span class="tag ${a.exec_mode}">${a.exec_mode}</span></td>
      <td class="mono" style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.action}</td>
      <td>${a.reaction || '<span class="dim">—</span>'}</td>
      <td class="dim">${a.quadrant || '—'}</td>`;
    const ops = el('td');
    if (['silent','notify'].includes(a.exec_mode)) {
      const u = el('button','op','↩ 撤销');
      u.onclick = async () => { try { await api(`/api/action/${a.id}/undo`, {method:'POST'}); } catch(e){ alert(e.message); } refresh(); };
      ops.append(u);
    }
    if (a.reaction == null && ['dry_run','notify','suggest','silent'].includes(a.exec_mode))
      ops.append(calibrateButtons({pref_id: a.pref_id, action_id: a.id}));  // 事后补一次三键裁决
    if (a.reaction == null && ['dry_run','suggest'].includes(a.exec_mode)) {
      const sk = el('button','op','跳过');
      sk.title = '影子期遗留：记 ignore 收尾，不再计入待裁决';
      sk.onclick = async () => { try { await api(`/api/action/${a.id}/skip`, {method:'POST'}); } catch(e){ alert(e.message); } refresh(); };
      ops.append(sk);
    }
    if (!ops.childNodes.length) ops.append(el('span','dim','—'));
    tr.append(ops); t.append(tr);
  }
  v.append(t);
}

async function renderEvents() {
  const d = await api('/api/events?limit=100');
  $('#subtitle').textContent = `最近 ${d.items.length} 条原始事件`;
  const v = $('#view'); v.innerHTML = '';
  const t = el('table');
  t.innerHTML = `<tr><th>id</th><th>时间</th><th>传感器</th><th>类型</th><th>载荷</th></tr>`;
  for (const e of d.items) {
    const tr = el('tr');
    tr.innerHTML = `<td class="num dim">${e.id}</td><td class="mono dim">${(e.ts_wall||'').slice(11,19)}</td>
      <td class="mono">${e.sensor}</td><td class="mono">${e.type}</td>
      <td class="mono dim" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.payload}</td>`;
    t.append(tr);
  }
  v.append(t);
}

function updatePauseBtn() {
  const b = $('#pause');
  b.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  b.style.borderColor = paused ? 'var(--warn)' : '';
  b.style.color = paused ? 'var(--warn)' : '';
}

document.querySelectorAll('nav button[data-tab]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); tab = b.dataset.tab; refresh();
  };
});
$('#pause').onclick = async () => {
  await api('/api/pause', {method:'POST', body:JSON.stringify({on: !paused}),
    headers:{'Content-Type':'application/json'}});
  refresh();
};

refresh();
timer = setInterval(refresh, 5000);
</script>
</body>
</html>
